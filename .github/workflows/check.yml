name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  # No AI attribution in commits or the pull request. A required check of its own, which
  # `check` does not wait for: editing the pull request's title or description re-runs only
  # this job (no-ai-signs-edited.yml), so `check` must already have run.
  no-ai-signs:
    uses: candlestack-tech/.github/.github/workflows/no-ai-signs.yml@main

  # The description closes an issue ("Closes #N"). Required and independent like no-ai-signs:
  # editing the description re-runs only this job (linked-issue-edited.yml).
  linked-issue:
    uses: candlestack-tech/.github/.github/workflows/linked-issue.yml@main

  # The title and branch follow the conventions; a warning when the pull request is large.
  # Required and independent like no-ai-signs: editing the title re-runs only this job
  # (pr-hygiene-edited.yml).
  pr-hygiene:
    uses: candlestack-tech/.github/.github/workflows/pr-hygiene.yml@main
    permissions:
      pull-requests: read

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build

  # The pre-commit hooks (.pre-commit-config.yaml) on every file: formatting, secrets, typos,
  # comments, Markdown, and actionlint and zizmor on the workflows.
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uvx pre-commit run --all-files --show-diff-on-failure
